<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 375" width="840" height="375" role="img" aria-label="A six-week-old commit added six retries on a fixed one second backoff, no jitter."><rect width="840" height="375" rx="8" fill="#0b0907"/><rect width="840" height="46" fill="#15110d"/><rect y="46" width="840" height="1" fill="#241d16"/><circle cx="30" cy="23.0" r="5" fill="#ff5330" opacity="0.85"/><circle cx="49" cy="23.0" r="5" fill="#ffa028" opacity="0.85"/><circle cx="68" cy="23.0" r="5" fill="#7ddc7d" opacity="0.85"/><text x="420.0" y="29.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#8d8171">2:28 AM  ·  SEV-1  ·  58,300 users down</text><text x="810" y="29.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#ff5330">DOWN  14m</text><text x="30" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="700" fill="#ffa028"> git log -S 'retry' --oneline client/http/ | head -1</text><text x="30" y="113" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#8d8171">4e1a9c2  make the client resilient to blips  (6 weeks ago)</text><text x="30" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="700" fill="#ffa028"> sed -n '19,21p' client/http/retry.py</text><text x="30" y="163" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#8d8171">RETRIES   = 6</text><text x="30" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#8d8171">BACKOFF_S = 1.0        # fixed</text><text x="30" y="213" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#8d8171">JITTER    = None</text><text x="30" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#8d8171"></text><text x="30" y="263" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#e8ddc9">blip fails 8,800 clients at once. all six retries land together.</text><text x="30" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#e8ddc9">they fail together, so they retry together, so they fail together.</text><text x="30" y="313" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#8d8171"></text><text x="30" y="338" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="700" fill="#ff5330">#incident-1  @here who owns gateway. answer.</text></svg>