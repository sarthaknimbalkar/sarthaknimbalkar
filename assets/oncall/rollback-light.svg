<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="Rolling back the deploy changes nothing; the cause did not ship tonight."><rect width="840" height="300" rx="8" fill="#04150b"/><rect width="840" height="46" fill="#0a2416"/><rect y="46" width="840" height="1" fill="#0f2e1b"/><circle cx="30" cy="23.0" r="5" fill="#ff5a4d" opacity="0.85"/><circle cx="49" cy="23.0" r="5" fill="#3dff8f" opacity="0.85"/><circle cx="68" cy="23.0" r="5" fill="#c9ff4d" opacity="0.85"/><text x="420.0" y="29.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#7ba98a">2:33 AM  ·  SEV-1  ·  78,800 users down</text><text x="810" y="29.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#ff5a4d">DOWN  19m</text><text x="30" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="700" fill="#3dff8f"> deploys rollback gateway --now</text><text x="30" y="113" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#7ba98a">reverted to v3.19.1 across 340 instances</text><text x="30" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="700" fill="#ff5a4d">no change. every region still down.</text><text x="30" y="163" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#7ba98a"></text><text x="30" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#3d6b4e">you rolled back the only thing that changed and it did not matter.</text><text x="30" y="213" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#3d6b4e">which means the thing that broke us did not change tonight.</text><text x="30" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#7ba98a"></text><text x="30" y="263" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="700" fill="#ff5a4d">#incident-1  @here who owns gateway. answer.</text></svg>