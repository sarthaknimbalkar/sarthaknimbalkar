<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-label="Exponential backoff spaces out the stampedes but keeps them synchronised."><rect width="840" height="400" rx="8" fill="#04150b"/><rect width="840" height="46" fill="#0a2416"/><rect y="46" width="840" height="1" fill="#0f2e1b"/><circle cx="30" cy="23.0" r="5" fill="#ff5a4d" opacity="0.85"/><circle cx="49" cy="23.0" r="5" fill="#3dff8f" opacity="0.85"/><circle cx="68" cy="23.0" r="5" fill="#c9ff4d" opacity="0.85"/><text x="420.0" y="29.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#7ba98a">2:57 AM  ·  SEV-1  ·  177,200 users down</text><text x="810" y="29.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#ff5a4d">DOWN  43m</text><text x="30" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="700" fill="#3dff8f"> git diff client/http/retry.py</text><text x="30" y="113" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#7ba98a">-BACKOFF_S = 1.0        # fixed</text><text x="30" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#c9ff4d">BACKOFF   = 'exponential: 1s, 2s, 4s, 8s ...'</text><text x="30" y="163" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="700" fill="#3dff8f"> deploy --canary 5% &amp;&amp; dep-status --replay-blip</text><text x="30" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="700" fill="#ff5a4d">stampede at +1s. then +3s. then +7s. smaller, still synchronised.</text><text x="30" y="213" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#7ba98a"></text><text x="30" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#3d6b4e">exponential backoff spaces out one client's attempts.</text><text x="30" y="263" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#3d6b4e">it does not stop eight thousand clients from counting in step.</text><text x="30" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="400" fill="#7ba98a"></text><text x="30" y="313" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="700" fill="#ff5a4d">#incident-1  @here who owns gateway. answer.</text><text x="30" y="338" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="700" fill="#ff5a4d">phone  +1 unknown  ·  a clinic cannot open the medication room</text><text x="30" y="363" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17.5" font-weight="700" fill="#ff5a4d">#incident-1  exec bridge opening. someone is going to ask you to explain.</text></svg>