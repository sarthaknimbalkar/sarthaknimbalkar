<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-label="Terminal: whoami returns Sarthak Nimbalkar, I build the thing before anyone asks for it. echo $LOCATION returns Michigan, working with anyone who has the right passion."><rect width="840" height="280" rx="8" fill="#04150b"/><rect width="840" height="46" fill="#0a2416"/><rect y="46" width="840" height="1" fill="#0f2e1b"/><circle cx="30" cy="23.0" r="5" fill="#ff5a4d" opacity="0.85"/><circle cx="49" cy="23.0" r="5" fill="#3dff8f" opacity="0.85"/><circle cx="68" cy="23.0" r="5" fill="#c9ff4d" opacity="0.85"/><text x="420.0" y="29.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#7ba98a">sarthak.sh</text><text x="30" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="18" font-weight="700" fill="#3dff8f">$ whoami</text><text x="30" y="114" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="18" fill="#eafff0">Sarthak Nimbalkar. I build the thing before anyone asks for it.</text><text x="30" y="166" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="18" font-weight="700" fill="#3dff8f">$ echo $LOCATION</text><text x="30" y="192" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="18" fill="#eafff0">Michigan, working with anyone who has the right passion.</text><text x="30" y="244" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="18" font-weight="700" fill="#3dff8f">$ </text><rect x="52" y="229" width="10" height="20" fill="#3dff8f"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/></rect></svg>