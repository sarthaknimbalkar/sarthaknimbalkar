<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-label="A 412 millisecond dependency fault fails 8,800 clients at the same instant. All of them retry at exactly one second, landing on the same millisecond, which fails them again. The loop feeds itself and saturates the gateway for two hours eleven minutes."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ba98a"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9ff4d"/></marker><marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00e05c"/></marker></defs><rect width="900" height="450" fill="#04150b"/><text x="40" y="52" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="30" fill="#eafff0">A 412 millisecond fault, amplified into two hours<tspan fill="#3dff8f">.</tspan></text><text x="40" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" letter-spacing="0.4" fill="#3d6b4e">THE DEPENDENCY RECOVERED IMMEDIATELY. THE CLIENTS DID NOT.</text><rect x="40" y="214" width="190" height="74" rx="7" fill="#0a2416" stroke="#00e05c" stroke-width="1.6"/><text x="135.0" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="700" fill="#00e05c">dependency gone</text><text x="135.0" y="266" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#7ba98a">412 ms</text><rect x="244" y="214" width="190" height="74" rx="7" fill="#0a2416" stroke="#0f2e1b" stroke-width="1.6"/><text x="339.0" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="700" fill="#eafff0">8,800 clients fail</text><text x="339.0" y="266" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#7ba98a">at the same instant</text><rect x="448" y="214" width="190" height="74" rx="7" fill="#0a2416" stroke="#0f2e1b" stroke-width="1.6"/><text x="543.0" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="700" fill="#eafff0">all of them retry</text><text x="543.0" y="266" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#7ba98a">at exactly +1.000 s</text><rect x="652" y="214" width="190" height="74" rx="7" fill="#0a2416" stroke="#3dff8f" stroke-width="1.6"/><text x="747.0" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="700" fill="#3dff8f">8,800 arrive inside</text><text x="747.0" y="266" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#7ba98a">one millisecond</text><line x1="233" y1="251.0" x2="235" y2="251.0" stroke="#7ba98a" stroke-width="1.6" marker-end="url(#a)"/><line x1="437" y1="251.0" x2="439" y2="251.0" stroke="#7ba98a" stroke-width="1.6" marker-end="url(#a)"/><line x1="641" y1="251.0" x2="643" y2="251.0" stroke="#7ba98a" stroke-width="1.6" marker-end="url(#a)"/><path d="M 747.0 198 C 747.0 148, 339.0 148, 339.0 196" fill="none" stroke="#c9ff4d" stroke-width="2.2" marker-end="url(#s)"/><text x="543.0" y="140" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="700" fill="#c9ff4d">they fail together, so they retry together, so they fail together</text><line x1="747.0" y1="291" x2="747.0" y2="333" stroke="#00e05c" stroke-width="1.6" marker-end="url(#e)"/><rect x="652" y="342" width="190" height="74" rx="7" fill="#0a2416" stroke="#00e05c" stroke-width="1.6" stroke-dasharray="5 4"/><text x="747.0" y="372" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="700" fill="#00e05c">gateway saturates</text><text x="747.0" y="394" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#7ba98a">2 h 11 m outage</text></svg>